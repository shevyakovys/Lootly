services:
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build: .
    command: dramatiq app.workers.tasks --processes 1 --threads 4
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  scheduler:
    build: .
    command: python -m app.scheduler
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lootly
      POSTGRES_USER: lootly
      POSTGRES_PASSWORD: lootly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lootly -d lootly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1

volumes:
  postgres_data:
