services:
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lootly
      POSTGRES_USER: lootly
      POSTGRES_PASSWORD: lootly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lootly -d lootly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
