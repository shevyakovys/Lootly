services:
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_AUTH_SECRET_KEY: ${LOOTLY_AUTH_SECRET_KEY:-development-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_AUTH_SECRET_KEY: ${LOOTLY_AUTH_SECRET_KEY:-development-only-change-me}
      LOOTLY_NOTIFICATION_WEBHOOK_URL: ${LOOTLY_NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  notifications:
    build: .
    command: python -m app.workers.notifications
    environment:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@postgres:5432/lootly
      LOOTLY_NOTIFICATION_WEBHOOK_URL: ${LOOTLY_NOTIFICATION_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lootly
      POSTGRES_USER: lootly
      POSTGRES_PASSWORD: lootly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lootly -d lootly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
