name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lootly_test
          POSTGRES_USER: lootly
          POSTGRES_PASSWORD: lootly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lootly -d lootly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@127.0.0.1:5432/lootly_test
      LOOTLY_AUTH_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Migrate test database
        run: alembic upgrade head
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Check hosted site JavaScript
        run: |
          node --check ../site/app.js
          node --check ../site/embed.js
          node -e "const fs=require('fs');const s=fs.readFileSync('../site/app.js','utf8');for(const name of ['addDaysIso','weekStartIso','localDateParts','durationLabel','dtZone','dayZone']){if(!new RegExp('(?:const|function)\\\\s+'+name+'\\\\b').test(s))throw new Error('Missing site helper: '+name)}"
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
