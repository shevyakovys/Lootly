name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lootly_test
          POSTGRES_USER: lootly
          POSTGRES_PASSWORD: lootly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lootly -d lootly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOOTLY_DATABASE_URL: postgresql+asyncpg://lootly:lootly@127.0.0.1:5432/lootly_test
      LOOTLY_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Migrate test database
        run: alembic upgrade head
      - name: Tests
        run: pytest
