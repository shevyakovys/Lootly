<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lootly — онлайн-запись</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#111827;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:white;border-bottom:1px solid #e5e7eb}
.brand{font-weight:800}.links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.links a{font-size:14px}
main{max-width:1180px;margin:auto;padding:28px 18px 56px}.hero{padding:50px 0}.hero h1{font-size:48px;line-height:1.05;margin:0 0 16px}.muted{color:#6b7280}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.stack{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:14px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:white}
button{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:white;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#b91c1c}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}
.metric{font-size:30px;font-weight:800;margin-top:6px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.choice{padding:14px;border:1px solid #dbe1ea;border-radius:14px;background:#fff;color:#111827;text-align:left}.choice:hover{border-color:#9ca3af}.choice.active{border-color:var(--accent,#111827);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent,#111827) 18%,transparent)}.widget-shell{max-width:620px;margin:0 auto;background:#fff;min-height:100vh;padding:24px}.widget-progress{height:5px;background:#eef0f3;border-radius:999px;overflow:hidden;margin:14px 0 24px}.widget-progress>span{display:block;height:100%;background:var(--accent,#111827);transition:width .2s}.widget-step h2{margin-bottom:8px}.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.slot{padding:10px;border:1px solid #dbe1ea;border-radius:10px;background:#fff;color:#111827}.slot.active{background:var(--accent,#111827);color:#fff;border-color:var(--accent,#111827)}.builder-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:20px;align-items:start}.preview-phone{position:sticky;top:88px;background:#111827;border-radius:28px;padding:10px;box-shadow:0 20px 50px rgba(15,23,42,.18)}.preview-screen{background:#f6f7f9;border-radius:20px;min-height:560px;padding:18px;overflow:hidden}.codebox{width:100%;min-height:112px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.checkrow{display:flex;gap:10px;align-items:center}.checkrow input{width:auto}.pill-list{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:7px 10px;border-radius:999px;border:1px solid #dbe1ea;background:#fff;font-size:13px}.pill input{width:auto;margin-right:6px}.error{padding:10px 12px;background:#fee2e2;color:#991b1b;border-radius:10px}.ok{padding:10px 12px;background:#dcfce7;color:#166534;border-radius:10px}
h1,h2,h3{margin-top:0}.section{margin-top:24px}.hidden{display:none!important}@media(max-width:700px){.hero h1{font-size:36px}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="#/">Lootly</a>
  <div class="links" id="navLinks"></div>
</nav>
<main id="app"></main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://tccmnfuwambjbsbmozdl.supabase.co";
const SUPABASE_KEY = "sb_publishable_Pk7SN0966fEeJHTmj_b4mQ_U7Vyp8kc";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.querySelector("#app");
const nav = document.querySelector("#navLinks");
const esc = (v="") => String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB"}).format(Number(v||0));
const dt = v => v ? new Date(v).toLocaleString("ru-RU") : "";
const d = v => v ? new Date(v).toISOString().slice(0,10) : "";
const msg = (text,type="ok") => '<div class="'+type+'">'+esc(text)+'</div>';
const slugify = (value="") => {
  const map = {
    а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",
    к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",
    х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"
  };
  return String(value).trim().toLowerCase()
    .split("").map(ch => map[ch] ?? ch).join("")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,100);
};
let currentProfile = null;

async function session(){
  const {data:{session}} = await sb.auth.getSession();
  return session;
}
async function profile(){
  if(currentProfile) return currentProfile;
  const s=await session(); if(!s) return null;
  const {data,error}=await sb.from("profiles").select("*").eq("id",s.user.id).single();
  if(error) throw error; currentProfile=data; return data;
}
async function requireAuth(){
  const s=await session(); if(!s){location.hash="#/login";return null}
  return s;
}
function setNav(auth){
  nav.innerHTML = auth
    ? '<a href="#/dashboard">Журнал</a><a href="#/catalog">Справочники</a><a href="#/schedule">Расписание</a><a href="#/widgets">Виджеты</a><button id="logoutBtn" class="secondary">Выйти</button>'
    : '<a href="#/setup">Создать организацию</a><a href="#/login">Войти</a>';
  document.querySelector("#logoutBtn")?.addEventListener("click",async()=>{await sb.auth.signOut();currentProfile=null;location.hash="#/"});
}
async function refreshNav(){setNav(Boolean(await session()))}

function home(){
  app.innerHTML='<section class="hero"><h1>Онлайн-запись без хаоса</h1><p class="muted">Расписание, клиенты, услуги и публичная запись в одном сервисе.</p><div class="toolbar"><a href="#/setup"><button>Создать организацию</button></a><a href="#/login"><button class="secondary">Войти</button></a></div></section><section class="grid"><div class="card"><h3>Расписание</h3><p class="muted">Рабочие часы, time off и свободные слоты.</p></div><div class="card"><h3>Журнал</h3><p class="muted">Статусы, переносы и история клиента.</p></div><div class="card"><h3>Онлайн-запись</h3><p class="muted">Публичная страница по slug организации.</p></div></section>';
}

function setup(){
  app.innerHTML='<div class="card" style="max-width:560px;margin:30px auto"><h1>Новая организация</h1><form id="setupForm" class="stack"><label>Название<input name="organization_name" required></label><label>Slug<input name="organization_slug" pattern="[a-z0-9-]{2,100}" placeholder="my-studio" required><small class="muted">Адрес публичной записи. Кириллица автоматически преобразуется, например «Онлайн-запись» → «onlayn-zapis».</small></label><label>Email владельца<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" minlength="10" required></label><button>Создать</button><div id="setupMsg"></div></form></div>';
  const setupForm=document.querySelector("#setupForm");
  const slugInput=setupForm.elements.organization_slug;
  slugInput.addEventListener("input",()=>{ slugInput.value=slugify(slugInput.value); });
  setupForm.addEventListener("submit",async e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget); const out=document.querySelector("#setupMsg"); out.innerHTML="";
    const email=String(f.get("email")); const password=String(f.get("password"));
    const organizationName=String(f.get("organization_name")).trim();
    let organizationSlug=slugify(String(f.get("organization_slug")));
    if(organizationSlug.length<2) organizationSlug=slugify(organizationName);
    if(organizationSlug.length<2) organizationSlug="org-"+crypto.randomUUID().slice(0,8);
    slugInput.value=organizationSlug;
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{organization_name:organizationName,organization_slug:organizationSlug}}});
    if(error){out.innerHTML=msg(error.message,"error");return}
    if(data.session){currentProfile=null;await refreshNav();location.hash="#/dashboard"}
    else out.innerHTML=msg("Аккаунт создан. Если Supabase запросит подтверждение email — подтвердите письмо, затем войдите.");
  });
}

function join(token){
  app.innerHTML='<div class="card" style="max-width:520px;margin:30px auto"><h1>Присоединиться к команде</h1><form id="joinForm" class="stack"><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" minlength="10" required></label><button>Создать аккаунт</button><div id="joinMsg"></div></form></div>';
  document.querySelector("#joinForm").addEventListener("submit",async e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget); const out=document.querySelector("#joinMsg");
    const {data,error}=await sb.auth.signUp({email:String(f.get("email")),password:String(f.get("password")),options:{data:{invite_token:token}}});
    if(error){out.innerHTML=msg(error.message,"error");return}
    if(data.session){currentProfile=null;await refreshNav();location.hash="#/dashboard"}
    else out.innerHTML=msg("Аккаунт создан. Подтвердите email при необходимости и войдите.");
  });
}

function login(){
  app.innerHTML='<div class="card" style="max-width:460px;margin:30px auto"><h1>Вход</h1><form id="loginForm" class="stack"><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" required></label><button>Войти</button><div id="loginMsg"></div></form></div>';
  document.querySelector("#loginForm").addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(e.currentTarget);const out=document.querySelector("#loginMsg");
    const {error}=await sb.auth.signInWithPassword({email:String(f.get("email")),password:String(f.get("password"))});
    if(error){out.innerHTML=msg(error.message,"error");return}
    currentProfile=null;await refreshNav();location.hash="#/dashboard";
  });
}

async function dashboard(){
  if(!await requireAuth())return;
  const p=await profile();
  const [{data:analytics,error:aerr},{data:appointments,error:err},{data:customers},{data:staff},{data:services},{data:locations},{data:notes}] = await Promise.all([
    sb.rpc("get_admin_analytics"),
    sb.from("appointments").select("*").order("start_at",{ascending:true}).limit(100),
    sb.from("customers").select("*").order("name"),
    sb.from("staff_members").select("*").order("name"),
    sb.from("services").select("*").order("name"),
    sb.from("locations").select("*").order("name"),
    sb.from("notification_outbox").select("id,event_type,status,due_at,created_at").order("created_at",{ascending:false}).limit(30)
  ]);
  if(aerr||err){app.innerHTML=msg((aerr||err).message,"error");return}
  const a=analytics||{};
  app.innerHTML='<h1>Журнал и аналитика</h1><p class="muted">Роль: '+esc(p.role)+'</p>'+
  '<div class="grid">'+
  metric("Записи",a.bookings_created||0)+metric("Онлайн",a.public_bookings||0)+metric("Завершено",a.completed||0)+metric("Отмены",Math.round(Number(a.cancellation_rate||0)*100)+"%")+metric("Конверсия",Math.round(Number(a.online_booking_conversion||0)*100)+"%")+metric("Повторные клиенты",Math.round(Number(a.repeat_customer_rate||0)*100)+"%")+
  '</div>'+
  (["owner","admin"].includes(p.role)?adminBookingForm(locations||[],services||[],staff||[],customers||[]):"")+
  '<section class="section"><h2>Записи</h2><div class="card" id="appointments">'+(appointments||[]).map(apptRow).join("")+'</div></section>'+
  '<section class="section"><h2>Уведомления</h2><div class="card">'+(notes||[]).map(n=>'<div class="row"><span>'+esc(n.event_type)+'</span><span class="tag">'+esc(n.status)+'</span><span>'+dt(n.due_at)+'</span></div>').join("")+'</div></section>';
  bindAppointmentActions();
  if(["owner","admin"].includes(p.role)) bindAdminBooking(locations||[],services||[],staff||[]);
}
function metric(label,value){return '<div class="card"><span class="muted">'+esc(label)+'</span><div class="metric">'+esc(value)+'</div></div>'}
function apptRow(x){
  const actions=["booked","confirmed"].includes(x.status)?'<div class="toolbar"><button data-status="'+x.id+'" data-to="confirmed">Подтвердить</button><button data-status="'+x.id+'" data-to="completed">Завершить</button><button data-reschedule="'+x.id+'" class="secondary">Перенести</button><button data-status="'+x.id+'" data-to="canceled" class="danger">Отменить</button></div>':"";
  return '<div class="row"><div><b>'+dt(x.start_at)+'</b><div class="muted">'+esc(x.status)+' · '+money(x.price)+' · '+esc(x.booking_source)+'</div></div>'+actions+'</div>';
}
function adminBookingForm(locations,services,staff,customers){
 return '<section class="section"><h2>Создать запись</h2><form id="adminBooking" class="card stack"><div class="grid"><label>Филиал<select name="location">'+locations.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Услуга<select name="service">'+services.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Сотрудник<select name="staff">'+staff.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Клиент<select name="customer">'+customers.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' · '+esc(x.phone)+'</option>').join("")+'</select></label></div><label>Дата<input name="day" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Свободный слот<select name="slot"><option value="">Сначала выберите параметры</option></select></label><button>Создать запись</button><div id="adminBookingMsg"></div></form></section>';
}
function bindAdminBooking(){
  const form=document.querySelector("#adminBooking"); if(!form)return;
  const refresh=async()=>{
    const f=new FormData(form);const slot=form.elements.slot;
    const {data,error}=await sb.rpc("get_public_availability",{p_slug:(await orgSlug()),p_location_id:f.get("location"),p_service_id:f.get("service"),p_day:f.get("day"),p_staff_id:f.get("staff")||null});
    slot.innerHTML=error?'<option>'+esc(error.message)+'</option>':'<option value="">Выберите слот</option>'+((data||[]).map(x=>'<option value="'+x.start_at+'">'+dt(x.start_at)+'</option>').join(""));
  };
  ["location","service","staff","day"].forEach(n=>form.elements[n].addEventListener("change",refresh));
  refresh();
  form.addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(form);const out=document.querySelector("#adminBookingMsg");
    const {error}=await sb.rpc("create_admin_booking",{p_location_id:f.get("location"),p_service_id:f.get("service"),p_staff_id:f.get("staff"),p_customer_id:f.get("customer"),p_start_at:f.get("slot"),p_note:null,p_booking_key:crypto.randomUUID()});
    if(error){out.innerHTML=msg(error.message,"error");return}out.innerHTML=msg("Запись создана");setTimeout(dashboard,400);
  });
}
async function orgSlug(){
  const p=await profile(); const {data}=await sb.from("organizations").select("slug").eq("id",p.organization_id).single();return data.slug;
}
function bindAppointmentActions(){
 document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",async()=>{const {error}=await sb.rpc("set_appointment_status",{p_appointment_id:b.dataset.status,p_status:b.dataset.to});if(error)alert(error.message);else dashboard()}));
 document.querySelectorAll("[data-reschedule]").forEach(b=>b.addEventListener("click",async()=>{const v=prompt("Новая дата/время в формате 2026-10-01T12:00:00+03:00");if(!v)return;const {error}=await sb.rpc("reschedule_appointment",{p_appointment_id:b.dataset.reschedule,p_start_at:v});if(error)alert(error.message);else dashboard()}));
}

async function catalog(){
 if(!await requireAuth())return;const p=await profile();
 const [{data:locations},{data:services},{data:staff},{data:customers},{data:invites}] = await Promise.all([
  sb.from("locations").select("*").order("name"),sb.from("services").select("*").order("name"),sb.from("staff_members").select("*").order("name"),sb.from("customers").select("*").order("name"),sb.from("user_invites").select("*").order("created_at",{ascending:false}).limit(20)
 ]);
 const manager=["owner","admin"].includes(p.role);
 app.innerHTML='<h1>Справочники</h1>'+(manager?'<div class="grid">'+formCard("Новый филиал","locForm",'<label>Название<input name="name" required></label><label>Timezone<input name="timezone" value="Europe/Moscow" required></label><label>Адрес<input name="address"></label>')+formCard("Новая услуга","serviceForm",'<label>Название<input name="name" required></label><label>Длительность, мин<input name="duration" type="number" value="60" min="1" required></label><label>Цена<input name="price" type="number" min="0" step=".01" required></label>')+formCard("Новый сотрудник","staffForm",'<label>Имя<input name="name" required></label><label>Филиал<select name="location">'+(locations||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label>')+formCard("Новый клиент","customerForm",'<label>Имя<input name="name" required></label><label>Телефон<input name="phone" required></label><label>Email<input name="email" type="email"></label>')+'</div>':"")+
 (manager?'<section class="section grid"><form id="assignForm" class="card stack"><h3>Назначить услугу</h3><label>Сотрудник<select name="staff">'+(staff||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Услуга<select name="service">'+(services||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><button>Назначить</button></form><form id="inviteForm" class="card stack"><h3>Пригласить пользователя</h3><label>Роль<select name="role"><option value="admin">Администратор</option><option value="staff">Сотрудник</option></select></label><label>Сотрудник<select name="staff"><option value="">—</option>'+(staff||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><button>Создать ссылку</button><div id="inviteMsg"></div></form></section>':"")+
 '<section class="section grid">'+listCard("Филиалы",locations,x=>x.name+" · "+x.timezone)+listCard("Услуги",services,x=>x.name+" · "+money(x.price)+" · "+x.duration_minutes+" мин")+listCard("Сотрудники",staff,x=>x.name)+listCard("Клиенты",customers,x=>x.name+" · "+x.phone)+'</section>'+
 (manager?'<section class="section"><h2>Приглашения</h2><div class="card">'+(invites||[]).map(i=>'<div class="row"><span>'+esc(i.role)+'</span><code>#/join/'+i.token+'</code><span>'+dt(i.expires_at)+'</span></div>').join("")+'</div></section>':"");
 if(manager)bindCatalogForms(p,locations||[]);
}
function formCard(title,id,body){return '<form id="'+id+'" class="card stack"><h3>'+title+'</h3>'+body+'<button>Добавить</button></form>'}
function listCard(title,rows,fmt){return '<div class="card"><h3>'+title+'</h3>'+((rows||[]).map(x=>'<div class="row"><span>'+esc(fmt(x))+'</span></div>').join(""))+'</div>'}
function bindCatalogForms(p){
 const bind=(id,table,map)=>document.querySelector("#"+id)?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.from(table).insert(map(f));if(error)alert(error.message);else catalog()});
 bind("locForm","locations",f=>({organization_id:p.organization_id,name:f.get("name"),timezone:f.get("timezone"),address:f.get("address")||null}));
 bind("serviceForm","services",f=>({organization_id:p.organization_id,name:f.get("name"),duration_minutes:Number(f.get("duration")),price:f.get("price")}));
 bind("staffForm","staff_members",f=>({organization_id:p.organization_id,name:f.get("name"),location_id:f.get("location")}));
 bind("customerForm","customers",f=>({organization_id:p.organization_id,name:f.get("name"),phone:f.get("phone"),email:f.get("email")||null}));
 document.querySelector("#assignForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.from("staff_services").insert({staff_id:f.get("staff"),service_id:f.get("service")});if(error&&!error.message.includes("duplicate"))alert(error.message);else alert("Назначено")});
 document.querySelector("#inviteForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const role=f.get("role");const staffId=f.get("staff")||null;if(role==="staff"&&!staffId){alert("Для роли staff выберите сотрудника");return}const {data,error}=await sb.from("user_invites").insert({organization_id:p.organization_id,role,staff_id:staffId}).select("token").single();if(error){alert(error.message);return}const link=location.href.split("#")[0]+"#/join/"+data.token;document.querySelector("#inviteMsg").innerHTML=msg("Ссылка: "+link)});
}

async function schedule(){
 if(!await requireAuth())return;const p=await profile();const {data:staff}=await sb.from("staff_members").select("*").order("name");const sid=staff?.[0]?.id||"";
 app.innerHTML='<h1>Расписание</h1><label style="max-width:400px">Сотрудник<select id="schedStaff">'+(staff||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><div id="schedBody" class="section"></div>';
 const load=async()=>{

async function widgetBuilder(){
  if(!await requireAuth())return;
  const p=await profile();
  if(!["owner","admin"].includes(p.role)){
    app.innerHTML=msg("Конструктор виджетов доступен владельцу и администратору.","error");return;
  }

  const [{data:widgets,error:werr},{data:locations},{data:services},{data:staff}] = await Promise.all([
    sb.from("booking_widgets").select("*").order("created_at",{ascending:true}),
    sb.from("locations").select("id,name").eq("active",true).order("name"),
    sb.from("services").select("id,name").eq("active",true).order("name"),
    sb.from("staff_members").select("id,name").eq("active",true).order("name")
  ]);
  if(werr){app.innerHTML=msg(werr.message,"error");return}

  let list=widgets||[];
  if(!list.length){
    const {data,error}=await sb.from("booking_widgets").insert({
      organization_id:p.organization_id,
      name:"Основной виджет",
      title:"Онлайн-запись",
      subtitle:"Выберите услугу и удобное время"
    }).select("*").single();
    if(error){app.innerHTML=msg(error.message,"error");return}
    list=[data];
  }

  let selected=list[0];
  app.innerHTML='<div class="toolbar" style="justify-content:space-between;align-items:center"><div><h1 style="margin-bottom:4px">Виджеты онлайн-записи</h1><p class="muted">Создавайте независимые формы для сайта, лендингов и рекламных кампаний.</p></div><button id="newWidget">+ Новый виджет</button></div>'+
  '<div class="builder-layout section"><div class="stack"><div class="card"><label>Виджет<select id="widgetSelect">'+list.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label></div><form id="widgetForm" class="card stack"></form><div class="card stack"><h3>Установка на сайт</h3><p class="muted">Вставьте код перед закрывающим тегом <code>&lt;/body&gt;</code>. Кнопка и форма загрузятся автоматически.</p><textarea id="embedCode" class="codebox" readonly></textarea><div class="toolbar"><button id="copyEmbed" type="button">Скопировать код</button><a id="openWidget" target="_blank"><button type="button" class="secondary">Открыть форму</button></a></div></div></div><aside class="preview-phone"><div class="preview-screen" id="widgetPreview"></div></aside></div>';

  const select=document.querySelector("#widgetSelect");
  const form=document.querySelector("#widgetForm");
  const preview=document.querySelector("#widgetPreview");
  const embed=document.querySelector("#embedCode");
  const openWidget=document.querySelector("#openWidget");

  const options=(items,selectedIds)=>items.map(x=>'<label class="pill"><input type="checkbox" value="'+x.id+'" '+(selectedIds.includes(x.id)?"checked":"")+'>'+esc(x.name)+'</label>').join("");

  function renderEditor(){
    const w=selected;
    const locIds=w.location_ids||[], svcIds=w.service_ids||[], staffIds=w.staff_ids||[];
    form.innerHTML='<h2 style="margin-bottom:4px">Настройки</h2>'+
      '<div class="grid"><label>Название в кабинете<input name="name" value="'+esc(w.name)+'" required></label><label>Активен<select name="active"><option value="true" '+(w.active?"selected":"")+'>Да</option><option value="false" '+(!w.active?"selected":"")+'>Нет</option></select></label></div>'+
      '<label>Заголовок формы<input name="title" value="'+esc(w.title||"Онлайн-запись")+'" required></label>'+
      '<label>Подзаголовок<input name="subtitle" value="'+esc(w.subtitle||"")+'" placeholder="Выберите услугу и удобное время"></label>'+
      '<div class="grid"><label>Основной цвет<input name="primary_color" type="color" value="'+esc(w.primary_color||"#111827")+'"></label><label>Текст кнопки<input name="button_text" value="'+esc(w.button_text||"Записаться")+'"></label></div>'+
      '<div class="grid"><label>Положение кнопки<select name="button_position"><option value="bottom-right">Справа снизу</option><option value="bottom-left">Слева снизу</option><option value="top-right">Справа сверху</option><option value="top-left">Слева сверху</option></select></label><label>Открытие<select name="open_mode"><option value="drawer">Боковая панель</option><option value="modal">Модальное окно</option></select></label><label>Сторона панели<select name="panel_side"><option value="right">Справа</option><option value="left">Слева</option></select></label><label>Первые шаги<select name="step_preset"><option value="location-first">Сначала филиал</option><option value="service-first">Сначала услуга</option></select></label></div>'+
      '<div class="grid"><label class="checkrow"><input name="button_animation" type="checkbox" '+(w.button_animation?"checked":"")+'>Анимация кнопки</label><label class="checkrow"><input name="show_staff_step" type="checkbox" '+(w.show_staff_step?"checked":"")+'>Показывать выбор специалиста</label><label class="checkrow"><input name="allow_any_staff" type="checkbox" '+(w.allow_any_staff?"checked":"")+'>Разрешить «любой специалист»</label><label class="checkrow"><input name="show_branding" type="checkbox" '+(w.show_branding?"checked":"")+'>Показывать «Powered by Lootly»</label></div>'+
      '<div><b>Филиалы</b><p class="muted">Ничего не отмечено = все активные филиалы.</p><div class="pill-list" data-scope="locations">'+options(locations||[],locIds)+'</div></div>'+
      '<div><b>Услуги</b><p class="muted">Ничего не отмечено = все активные услуги.</p><div class="pill-list" data-scope="services">'+options(services||[],svcIds)+'</div></div>'+
      '<div><b>Сотрудники</b><p class="muted">Ничего не отмечено = все подходящие сотрудники.</p><div class="pill-list" data-scope="staff">'+options(staff||[],staffIds)+'</div></div>'+
      '<div class="toolbar"><button type="submit">Сохранить настройки</button><button id="deleteWidget" type="button" class="danger">Удалить</button></div><div id="widgetMsg"></div>';
    form.elements.button_position.value=w.button_position||"bottom-right";
    form.elements.open_mode.value=w.open_mode||"drawer";
    form.elements.panel_side.value=w.panel_side||"right";
    form.elements.step_preset.value=(w.step_order||[])[0]==="service"?"service-first":"location-first";
    updatePreview();
    updateEmbed();
  }

  function collect(){
    const checked=scope=>[...form.querySelectorAll('[data-scope="'+scope+'"] input:checked')].map(x=>x.value);
    return {
      organization_id:p.organization_id,
      name:form.elements.name.value.trim(),
      active:form.elements.active.value==="true",
      title:form.elements.title.value.trim()||"Онлайн-запись",
      subtitle:form.elements.subtitle.value.trim()||null,
      primary_color:form.elements.primary_color.value,
      button_text:form.elements.button_text.value.trim()||"Записаться",
      button_position:form.elements.button_position.value,
      panel_side:form.elements.panel_side.value,
      open_mode:form.elements.open_mode.value,
      button_animation:form.elements.button_animation.checked,
      show_staff_step:form.elements.show_staff_step.checked,
      allow_any_staff:form.elements.allow_any_staff.checked,
      show_branding:form.elements.show_branding.checked,
      location_ids:checked("locations"),
      service_ids:checked("services"),
      staff_ids:checked("staff"),
      step_order:form.elements.step_preset.value==="service-first"
        ? ["service","location","staff","datetime"]
        : ["location","service","staff","datetime"],
      updated_at:new Date().toISOString()
    };
  }

  function updatePreview(){
    const values=form.elements.name?collect():selected;
    preview.style.setProperty("--accent",values.primary_color||"#111827");
    preview.innerHTML='<div style="height:100%;display:flex;flex-direction:column"><div style="padding:14px 4px"><div style="font-weight:800;font-size:22px">'+esc(values.title||"Онлайн-запись")+'</div><div class="muted" style="margin-top:5px">'+esc(values.subtitle||"Выберите услугу и удобное время")+'</div></div><div class="widget-progress"><span style="width:34%"></span></div><div class="card" style="box-shadow:none"><div class="muted" style="font-size:12px">Шаг 1 из 4</div><h3 style="margin:8px 0 14px">'+((values.step_order||[])[0]==="service"?"Выберите услугу":"Выберите филиал")+'</h3><div class="choice-grid"><button class="choice active" type="button">Основной вариант</button><button class="choice" type="button">Другой вариант</button></div><button type="button" style="margin-top:18px;width:100%;background:'+values.primary_color+'">Продолжить</button></div><div style="margin-top:auto;text-align:center;padding-top:16px" class="muted">'+(values.show_branding?"Powered by Lootly":"")+'</div></div>';
  }

  function updateEmbed(){
    const base="https://shevyakovys.github.io/Lootly";
    embed.value='<script src="'+base+'/embed.js" data-lootly-widget="'+selected.public_key+'" async><'+'/script>';
    openWidget.href=base+"/#/widget/"+selected.public_key;
  }

  select.addEventListener("change",()=>{selected=list.find(x=>x.id===select.value)||list[0];renderEditor()});
  form.addEventListener("input",()=>updatePreview());
  form.addEventListener("change",()=>updatePreview());
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const values=collect(), out=document.querySelector("#widgetMsg");out.innerHTML="";
    const {data,error}=await sb.from("booking_widgets").update(values).eq("id",selected.id).select("*").single();
    if(error){out.innerHTML=msg(error.message,"error");return}
    selected=data;list=list.map(x=>x.id===data.id?data:x);out.innerHTML=msg("Настройки сохранены");updateEmbed();
  });
  document.querySelector("#copyEmbed").addEventListener("click",async()=>{await navigator.clipboard.writeText(embed.value);document.querySelector("#copyEmbed").textContent="Скопировано";setTimeout(()=>document.querySelector("#copyEmbed").textContent="Скопировать код",1200)});
  document.querySelector("#newWidget").addEventListener("click",async()=>{
    const {data,error}=await sb.from("booking_widgets").insert({organization_id:p.organization_id,name:"Новый виджет",title:"Онлайн-запись",subtitle:"Выберите услугу и удобное время"}).select("*").single();
    if(error){alert(error.message);return}list.push(data);selected=data;select.insertAdjacentHTML("beforeend",'<option value="'+data.id+'">'+esc(data.name)+'</option>');select.value=data.id;renderEditor();
  });
  form.addEventListener("click",async e=>{
    if(e.target?.id!=="deleteWidget")return;
    if(list.length===1){alert("Должен остаться хотя бы один виджет.");return}
    if(!confirm("Удалить этот виджет? Код вставки перестанет работать."))return;
    const {error}=await sb.from("booking_widgets").delete().eq("id",selected.id);if(error){alert(error.message);return}
    list=list.filter(x=>x.id!==selected.id);selected=list[0];select.querySelector('option[value="'+e.target.dataset?.id+'"]')?.remove();select.innerHTML=list.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");select.value=selected.id;renderEditor();
  });

  renderEditor();
}

async function publicWidget(publicKey){
  document.querySelector("nav").classList.add("hidden");
  app.style.maxWidth="none";app.style.padding="0";app.style.margin="0";
  const {data,error}=await sb.rpc("get_public_widget",{p_public_key:publicKey});
  if(error||!data){app.innerHTML='<div class="widget-shell">'+msg(error?.message||"Виджет недоступен","error")+'</div>';return}
  const cfg=data.widget, locs=data.locations||[], services=data.services||[];
  app.style.setProperty("--accent",cfg.primary_color||"#111827");

  const state={location:null,service:null,staff:null,day:new Date().toISOString().slice(0,10),slot:null,staffList:[],slots:[],index:0};
  let steps=(cfg.step_order||["location","service","staff","datetime"]).filter(x=>x!=="staff"||cfg.show_staff_step);
  steps=steps.filter((x,i,a)=>["location","service","staff","datetime"].includes(x)&&a.indexOf(x)===i);
  ["location","service","datetime"].forEach(x=>{if(!steps.includes(x))steps.push(x)});
  steps.push("contact");

  if(locs.length===1) state.location=locs[0];
  if(services.length===1) state.service=services[0];

  const titleFor=s=>({location:"Выберите филиал",service:"Выберите услугу",staff:"Выберите специалиста",datetime:"Выберите дату и время",contact:"Ваши контакты"}[s]||"Онлайн-запись");
  const subtitleFor=s=>({location:"Где вам удобнее записаться?",service:"Что вы хотите сделать?",staff:"К кому хотите попасть?",datetime:"Покажем только свободное время",contact:"Осталось подтвердить запись"}[s]||"");

  async function loadStaff(){
    if(!state.location||!state.service)return;
    const {data:rows,error}=await sb.rpc("get_public_widget_staff",{p_public_key:publicKey,p_location_id:state.location.id,p_service_id:state.service.id});
    if(error)throw error;state.staffList=rows||[];
  }
  async function loadSlots(){
    if(!state.location||!state.service)return;
    const {data:rows,error}=await sb.rpc("get_public_widget_availability",{p_public_key:publicKey,p_location_id:state.location.id,p_service_id:state.service.id,p_day:state.day,p_staff_id:state.staff?.id||null});
    if(error)throw error;state.slots=rows||[];state.slot=null;
  }
  function next(){if(state.index<steps.length-1){state.index++;render()}}
  function back(){if(state.index>0){state.index--;render()}}

  async function render(){
    const step=steps[state.index];
    if(step==="staff"&&state.location&&state.service&&!state.staffList.length){try{await loadStaff()}catch(e){app.innerHTML='<div class="widget-shell">'+msg(e.message,"error")+'</div>';return}}
    if(step==="datetime"&&state.location&&state.service&&!state.slots.length){try{await loadSlots()}catch(e){app.innerHTML='<div class="widget-shell">'+msg(e.message,"error")+'</div>';return}}
    const progress=Math.round(((state.index+1)/steps.length)*100);
    let body="";
    if(step==="location"){
      body='<div class="choice-grid">'+locs.map(x=>'<button type="button" class="choice '+(state.location?.id===x.id?"active":"")+'" data-location="'+x.id+'"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.address||"")+'</div></button>').join("")+'</div>';
    } else if(step==="service"){
      body='<div class="choice-grid">'+services.map(x=>'<button type="button" class="choice '+(state.service?.id===x.id?"active":"")+'" data-service="'+x.id+'"><b>'+esc(x.name)+'</b><div class="muted">'+x.duration_minutes+' мин · '+money(x.price)+'</div></button>').join("")+'</div>';
    } else if(step==="staff"){
      body='<div class="choice-grid">'+(cfg.allow_any_staff?'<button type="button" class="choice '+(!state.staff?"active":"")+'" data-staff="">Любой доступный<div class="muted">Подберём автоматически</div></button>':"")+state.staffList.map(x=>'<button type="button" class="choice '+(state.staff?.id===x.id?"active":"")+'" data-staff="'+x.id+'"><b>'+esc(x.name)+'</b></button>').join("")+'</div>';
    } else if(step==="datetime"){
      body='<label>Дата<input id="widgetDay" type="date" value="'+state.day+'" min="'+new Date().toISOString().slice(0,10)+'"></label><div class="section"><div class="slot-grid">'+(state.slots.length?state.slots.map((x,i)=>'<button type="button" class="slot '+(state.slot===i?"active":"")+'" data-slot="'+i+'">'+new Date(x.start_at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+'</button>').join(""):'<div class="muted">На эту дату свободного времени нет.</div>')+'</div></div>';
    } else {
      body='<form id="widgetContact" class="stack"><div class="card" style="box-shadow:none;background:#f8fafc"><div><b>'+esc(state.service?.name||"")+'</b></div><div class="muted">'+esc(state.location?.name||"")+' · '+(state.slot!==null?dt(state.slots[state.slot]?.start_at):"")+'</div></div><label>Имя<input name="name" autocomplete="name" required></label><label>Телефон<input name="phone" autocomplete="tel" required></label><label>Email <span class="muted">(необязательно)</span><input name="email" type="email" autocomplete="email"></label><button>Подтвердить запись</button><div id="widgetResult"></div></form>';
    }

    app.innerHTML='<div class="widget-shell"><header><div style="font-weight:800;font-size:25px">'+esc(cfg.title||data.organization.name)+'</div><div class="muted" style="margin-top:5px">'+esc(cfg.subtitle||data.organization.name)+'</div></header><div class="widget-progress"><span style="width:'+progress+'%"></span></div><section class="widget-step"><div class="muted" style="font-size:12px">Шаг '+(state.index+1)+' из '+steps.length+'</div><h2 style="margin-top:6px">'+titleFor(step)+'</h2><p class="muted">'+subtitleFor(step)+'</p>'+body+'</section>'+(step!=="contact"?'<div class="toolbar" style="margin-top:22px;justify-content:space-between">'+(state.index?'<button type="button" class="secondary" id="widgetBack">Назад</button>':'<span></span>')+'<button type="button" id="widgetNext">Продолжить</button></div>':'')+(cfg.show_branding?'<div class="muted" style="text-align:center;font-size:12px;margin-top:24px">Powered by Lootly</div>':'')+'</div>';
    document.querySelector("#widgetBack")?.addEventListener("click",back);
    document.querySelectorAll("[data-location]").forEach(b=>b.addEventListener("click",()=>{state.location=locs.find(x=>x.id===b.dataset.location);state.staff=null;state.staffList=[];state.slots=[];render()}));
    document.querySelectorAll("[data-service]").forEach(b=>b.addEventListener("click",()=>{state.service=services.find(x=>x.id===b.dataset.service);state.staff=null;state.staffList=[];state.slots=[];render()}));
    document.querySelectorAll("[data-staff]").forEach(b=>b.addEventListener("click",()=>{state.staff=b.dataset.staff?state.staffList.find(x=>x.id===b.dataset.staff):null;state.slots=[];render()}));
    document.querySelectorAll("[data-slot]").forEach(b=>b.addEventListener("click",()=>{state.slot=Number(b.dataset.slot);render()}));
    document.querySelector("#widgetDay")?.addEventListener("change",async e=>{state.day=e.target.value;state.slots=[];await loadSlots();render()});
    document.querySelector("#widgetNext")?.addEventListener("click",async()=>{
      if(step==="location"&&!state.location)return alert("Выберите филиал");
      if(step==="service"&&!state.service)return alert("Выберите услугу");
      if(step==="staff"&&!cfg.allow_any_staff&&!state.staff)return alert("Выберите специалиста");
      if(step==="datetime"&&state.slot===null)return alert("Выберите время");
      if(step==="staff"){state.slots=[]}
      next();
    });
    document.querySelector("#widgetContact")?.addEventListener("submit",async e=>{
      e.preventDefault();const f=new FormData(e.currentTarget),out=document.querySelector("#widgetResult");
      const slot=state.slots[state.slot];if(!slot){out.innerHTML=msg("Выберите время","error");return}
      const staffId=state.staff?.id||slot.staff_id;
      const {data:booking,error}=await sb.rpc("create_public_widget_booking",{p_public_key:publicKey,p_location_id:state.location.id,p_service_id:state.service.id,p_staff_id:staffId,p_start_at:slot.start_at,p_customer_name:f.get("name"),p_customer_phone:f.get("phone"),p_customer_email:f.get("email")||null,p_note:null,p_booking_key:crypto.randomUUID()});
      if(error){out.innerHTML=msg(error.message,"error");state.slots=[];return}
      app.innerHTML='<div class="widget-shell" style="display:grid;place-items:center;text-align:center"><div><div style="font-size:52px">✓</div><h1>Запись создана</h1><p class="muted">'+esc(state.service.name)+' · '+dt(booking.start_at)+'</p><p>Мы сохранили вашу запись.</p>'+(cfg.show_branding?'<div class="muted" style="font-size:12px;margin-top:30px">Powered by Lootly</div>':'')+'</div></div>';
    });
  }
  render();
}

async function publicBook(slug){
 const {data:catalog,error}=await sb.rpc("get_public_catalog",{p_slug:slug});
 if(error||!catalog){app.innerHTML=msg(error?.message||"Организация не найдена","error");return}
 const key="lootly_booking_"+slug;let sk=sessionStorage.getItem(key);if(!sk){sk=crypto.randomUUID();sessionStorage.setItem(key,sk)}sb.rpc("track_public_booking_view",{p_slug:slug,p_session_key:sk});
 const locs=catalog.locations||[], services=catalog.services||[];
 app.innerHTML='<div class="card" style="max-width:760px;margin:auto"><h1>'+esc(catalog.organization.name)+'</h1><p class="muted">Онлайн-запись</p><form id="publicForm" class="stack"><div class="grid"><label>Филиал<select name="location">'+locs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Услуга<select name="service">'+services.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' · '+money(x.price)+'</option>').join("")+'</select></label><label>Специалист<select name="staff"><option value="">Любой доступный</option></select></label><label>Дата<input name="day" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label></div><label>Свободный слот<select name="slot"><option value="">Выберите слот</option></select></label><label>Имя<input name="name" required></label><label>Телефон<input name="phone" required></label><label>Email<input name="email" type="email"></label><button>Записаться</button><div id="pubMsg"></div></form></div>';
 const form=document.querySelector("#publicForm");
 const loadStaff=async()=>{const f=new FormData(form);const {data}=await sb.rpc("get_public_staff",{p_slug:slug,p_location_id:f.get("location"),p_service_id:f.get("service")});form.elements.staff.innerHTML='<option value="">Любой доступный</option>'+((data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join(""));loadSlots()};
 const loadSlots=async()=>{const f=new FormData(form);const {data,error}=await sb.rpc("get_public_availability",{p_slug:slug,p_location_id:f.get("location"),p_service_id:f.get("service"),p_day:f.get("day"),p_staff_id:f.get("staff")||null});form.elements.slot.innerHTML=error?'<option>'+esc(error.message)+'</option>':'<option value="">Выберите слот</option>'+((data||[]).map(x=>'<option data-staff="'+x.staff_id+'" value="'+x.start_at+'">'+dt(x.start_at)+'</option>').join(""))};
 form.elements.location.addEventListener("change",loadStaff);form.elements.service.addEventListener("change",loadStaff);form.elements.staff.addEventListener("change",loadSlots);form.elements.day.addEventListener("change",loadSlots);loadStaff();
 form.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(form),opt=form.elements.slot.selectedOptions[0],out=document.querySelector("#pubMsg");if(!f.get("slot"))return;const staffId=f.get("staff")||opt.dataset.staff;const {data,error}=await sb.rpc("create_public_booking",{p_slug:slug,p_location_id:f.get("location"),p_service_id:f.get("service"),p_staff_id:staffId,p_start_at:f.get("slot"),p_customer_name:f.get("name"),p_customer_phone:f.get("phone"),p_customer_email:f.get("email")||null,p_note:null,p_booking_key:crypto.randomUUID()});if(error){out.innerHTML=msg(error.message,"error");loadSlots();return}out.innerHTML=msg("Готово. Номер записи: "+data.id);form.querySelector("button").disabled=true});
}

async function route(){
 document.querySelector("nav").classList.remove("hidden");
 app.style.maxWidth="1180px";app.style.padding="28px 18px 56px";app.style.margin="auto";
 await refreshNav();
 const parts=(location.hash||"#/").replace(/^#\//,"").split("/").filter(Boolean);
 try{
  if(!parts.length) return home();
  if(parts[0]==="setup") return setup();
  if(parts[0]==="join"&&parts[1]) return join(parts[1]);
  if(parts[0]==="login") return login();
  if(parts[0]==="dashboard") return dashboard();
  if(parts[0]==="catalog") return catalog();
  if(parts[0]==="schedule") return schedule();
  if(parts[0]==="widgets") return widgetBuilder();
  if(parts[0]==="widget"&&parts[1]) return publicWidget(parts[1]);
  if(parts[0]==="book"&&parts[1]) return publicBook(parts[1]);
  home();
 }catch(e){app.innerHTML=msg(e?.message||"Ошибка","error")}
}
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
