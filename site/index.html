<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lootly — онлайн-запись</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#111827;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:white;border-bottom:1px solid #e5e7eb}
.brand{font-weight:800}.links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.links a{font-size:14px}
main{max-width:1180px;margin:auto;padding:28px 18px 56px}.hero{padding:50px 0}.hero h1{font-size:48px;line-height:1.05;margin:0 0 16px}.muted{color:#6b7280}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.stack{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:14px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:white}
button{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:white;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#b91c1c}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}
.metric{font-size:30px;font-weight:800;margin-top:6px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.error{padding:10px 12px;background:#fee2e2;color:#991b1b;border-radius:10px}.ok{padding:10px 12px;background:#dcfce7;color:#166534;border-radius:10px}
h1,h2,h3{margin-top:0}.section{margin-top:24px}.hidden{display:none!important}@media(max-width:700px){.hero h1{font-size:36px}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="#/">Lootly</a>
  <div class="links" id="navLinks"></div>
</nav>
<main id="app"></main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://tccmnfuwambjbsbmozdl.supabase.co";
const SUPABASE_KEY = "sb_publishable_Pk7SN0966fEeJHTmj_b4mQ_U7Vyp8kc";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.querySelector("#app");
const nav = document.querySelector("#navLinks");
const esc = (v="") => String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB"}).format(Number(v||0));
const dt = v => v ? new Date(v).toLocaleString("ru-RU") : "";
const d = v => v ? new Date(v).toISOString().slice(0,10) : "";
const msg = (text,type="ok") => '<div class="'+type+'">'+esc(text)+'</div>';
let currentProfile = null;

async function session(){
  const {data:{session}} = await sb.auth.getSession();
  return session;
}
async function profile(){
  if(currentProfile) return currentProfile;
  const s=await session(); if(!s) return null;
  const {data,error}=await sb.from("profiles").select("*").eq("id",s.user.id).single();
  if(error) throw error; currentProfile=data; return data;
}
async function requireAuth(){
  const s=await session(); if(!s){location.hash="#/login";return null}
  return s;
}
function setNav(auth){
  nav.innerHTML = auth
    ? '<a href="#/dashboard">Журнал</a><a href="#/catalog">Справочники</a><a href="#/schedule">Расписание</a><button id="logoutBtn" class="secondary">Выйти</button>'
    : '<a href="#/setup">Создать организацию</a><a href="#/login">Войти</a>';
  document.querySelector("#logoutBtn")?.addEventListener("click",async()=>{await sb.auth.signOut();currentProfile=null;location.hash="#/"});
}
async function refreshNav(){setNav(Boolean(await session()))}

function home(){
  app.innerHTML='<section class="hero"><h1>Онлайн-запись без хаоса</h1><p class="muted">Расписание, клиенты, услуги и публичная запись в одном сервисе.</p><div class="toolbar"><a href="#/setup"><button>Создать организацию</button></a><a href="#/login"><button class="secondary">Войти</button></a></div></section><section class="grid"><div class="card"><h3>Расписание</h3><p class="muted">Рабочие часы, time off и свободные слоты.</p></div><div class="card"><h3>Журнал</h3><p class="muted">Статусы, переносы и история клиента.</p></div><div class="card"><h3>Онлайн-запись</h3><p class="muted">Публичная страница по slug организации.</p></div></section>';
}

function setup(){
  app.innerHTML='<div class="card" style="max-width:560px;margin:30px auto"><h1>Новая организация</h1><form id="setupForm" class="stack"><label>Название<input name="organization_name" required></label><label>Slug<input name="organization_slug" pattern="[a-z0-9-]{2,100}" placeholder="my-studio" required></label><label>Email владельца<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" minlength="10" required></label><button>Создать</button><div id="setupMsg"></div></form></div>';
  document.querySelector("#setupForm").addEventListener("submit",async e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget); const out=document.querySelector("#setupMsg"); out.innerHTML="";
    const email=String(f.get("email")); const password=String(f.get("password"));
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{organization_name:String(f.get("organization_name")),organization_slug:String(f.get("organization_slug"))}}});
    if(error){out.innerHTML=msg(error.message,"error");return}
    if(data.session){currentProfile=null;await refreshNav();location.hash="#/dashboard"}
    else out.innerHTML=msg("Аккаунт создан. Если Supabase запросит подтверждение email — подтвердите письмо, затем войдите.");
  });
}

function join(token){
  app.innerHTML='<div class="card" style="max-width:520px;margin:30px auto"><h1>Присоединиться к команде</h1><form id="joinForm" class="stack"><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" minlength="10" required></label><button>Создать аккаунт</button><div id="joinMsg"></div></form></div>';
  document.querySelector("#joinForm").addEventListener("submit",async e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget); const out=document.querySelector("#joinMsg");
    const {data,error}=await sb.auth.signUp({email:String(f.get("email")),password:String(f.get("password")),options:{data:{invite_token:token}}});
    if(error){out.innerHTML=msg(error.message,"error");return}
    if(data.session){currentProfile=null;await refreshNav();location.hash="#/dashboard"}
    else out.innerHTML=msg("Аккаунт создан. Подтвердите email при необходимости и войдите.");
  });
}

function login(){
  app.innerHTML='<div class="card" style="max-width:460px;margin:30px auto"><h1>Вход</h1><form id="loginForm" class="stack"><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" required></label><button>Войти</button><div id="loginMsg"></div></form></div>';
  document.querySelector("#loginForm").addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(e.currentTarget);const out=document.querySelector("#loginMsg");
    const {error}=await sb.auth.signInWithPassword({email:String(f.get("email")),password:String(f.get("password"))});
    if(error){out.innerHTML=msg(error.message,"error");return}
    currentProfile=null;await refreshNav();location.hash="#/dashboard";
  });
}

async function dashboard(){
  if(!await requireAuth())return;
  const p=await profile();
  const [{data:analytics,error:aerr},{data:appointments,error:err},{data:customers},{data:staff},{data:services},{data:locations},{data:notes}] = await Promise.all([
    sb.rpc("get_admin_analytics"),
    sb.from("appointments").select("*").order("start_at",{ascending:true}).limit(100),
    sb.from("customers").select("*").order("name"),
    sb.from("staff_members").select("*").order("name"),
    sb.from("services").select("*").order("name"),
    sb.from("locations").select("*").order("name"),
    sb.from("notification_outbox").select("id,event_type,status,due_at,created_at").order("created_at",{ascending:false}).limit(30)
  ]);
  if(aerr||err){app.innerHTML=msg((aerr||err).message,"error");return}
  const a=analytics||{};
  app.innerHTML='<h1>Журнал и аналитика</h1><p class="muted">Роль: '+esc(p.role)+'</p>'+
  '<div class="grid">'+
  metric("Записи",a.bookings_created||0)+metric("Онлайн",a.public_bookings||0)+metric("Завершено",a.completed||0)+metric("Отмены",Math.round(Number(a.cancellation_rate||0)*100)+"%")+metric("Конверсия",Math.round(Number(a.online_booking_conversion||0)*100)+"%")+metric("Повторные клиенты",Math.round(Number(a.repeat_customer_rate||0)*100)+"%")+
  '</div>'+
  (["owner","admin"].includes(p.role)?adminBookingForm(locations||[],services||[],staff||[],customers||[]):"")+
  '<section class="section"><h2>Записи</h2><div class="card" id="appointments">'+(appointments||[]).map(apptRow).join("")+'</div></section>'+
  '<section class="section"><h2>Уведомления</h2><div class="card">'+(notes||[]).map(n=>'<div class="row"><span>'+esc(n.event_type)+'</span><span class="tag">'+esc(n.status)+'</span><span>'+dt(n.due_at)+'</span></div>').join("")+'</div></section>';
  bindAppointmentActions();
  if(["owner","admin"].includes(p.role)) bindAdminBooking(locations||[],services||[],staff||[]);
}
function metric(label,value){return '<div class="card"><span class="muted">'+esc(label)+'</span><div class="metric">'+esc(value)+'</div></div>'}
function apptRow(x){
  const actions=["booked","confirmed"].includes(x.status)?'<div class="toolbar"><button data-status="'+x.id+'" data-to="confirmed">Подтвердить</button><button data-status="'+x.id+'" data-to="completed">Завершить</button><button data-reschedule="'+x.id+'" class="secondary">Перенести</button><button data-status="'+x.id+'" data-to="canceled" class="danger">Отменить</button></div>':"";
  return '<div class="row"><div><b>'+dt(x.start_at)+'</b><div class="muted">'+esc(x.status)+' · '+money(x.price)+' · '+esc(x.booking_source)+'</div></div>'+actions+'</div>';
}
function adminBookingForm(locations,services,staff,customers){
 return '<section class="section"><h2>Создать запись</h2><form id="adminBooking" class="card stack"><div class="grid"><label>Филиал<select name="location">'+locations.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Услуга<select name="service">'+services.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Сотрудник<select name="staff">'+staff.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Клиент<select name="customer">'+customers.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' · '+esc(x.phone)+'</option>').join("")+'</select></label></div><label>Дата<input name="day" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Свободный слот<select name="slot"><option value="">Сначала выберите параметры</option></select></label><button>Создать запись</button><div id="adminBookingMsg"></div></form></section>';
}
function bindAdminBooking(){
  const form=document.querySelector("#adminBooking"); if(!form)return;
  const refresh=async()=>{
    const f=new FormData(form);const slot=form.elements.slot;
    const {data,error}=await sb.rpc("get_public_availability",{p_slug:(await orgSlug()),p_location_id:f.get("location"),p_service_id:f.get("service"),p_day:f.get("day"),p_staff_id:f.get("staff")||null});
    slot.innerHTML=error?'<option>'+esc(error.message)+'</option>':'<option value="">Выберите слот</option>'+((data||[]).map(x=>'<option value="'+x.start_at+'">'+dt(x.start_at)+'</option>').join(""));
  };
  ["location","service","staff","day"].forEach(n=>form.elements[n].addEventListener("change",refresh));
  refresh();
  form.addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(form);const out=document.querySelector("#adminBookingMsg");
    const {error}=await sb.rpc("create_admin_booking",{p_location_id:f.get("location"),p_service_id:f.get("service"),p_staff_id:f.get("staff"),p_customer_id:f.get("customer"),p_start_at:f.get("slot"),p_note:null,p_booking_key:crypto.randomUUID()});
    if(error){out.innerHTML=msg(error.message,"error");return}out.innerHTML=msg("Запись создана");setTimeout(dashboard,400);
  });
}
async function orgSlug(){
  const p=await profile(); const {data}=await sb.from("organizations").select("slug").eq("id",p.organization_id).single();return data.slug;
}
function bindAppointmentActions(){
 document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",async()=>{const {error}=await sb.rpc("set_appointment_status",{p_appointment_id:b.dataset.status,p_status:b.dataset.to});if(error)alert(error.message);else dashboard()}));
 document.querySelectorAll("[data-reschedule]").forEach(b=>b.addEventListener("click",async()=>{const v=prompt("Новая дата/время в формате 2026-10-01T12:00:00+03:00");if(!v)return;const {error}=await sb.rpc("reschedule_appointment",{p_appointment_id:b.dataset.reschedule,p_start_at:v});if(error)alert(error.message);else dashboard()}));
}

async function catalog(){
 if(!await requireAuth())return;const p=await profile();
 const [{data:locations},{data:services},{data:staff},{data:customers},{data:invites}] = await Promise.all([
  sb.from("locations").select("*").order("name"),sb.from("services").select("*").order("name"),sb.from("staff_members").select("*").order("name"),sb.from("customers").select("*").order("name"),sb.from("user_invites").select("*").order("created_at",{ascending:false}).limit(20)
 ]);
 const manager=["owner","admin"].includes(p.role);
 app.innerHTML='<h1>Справочники</h1>'+(manager?'<div class="grid">'+formCard("Новый филиал","locForm",'<label>Название<input name="name" required></label><label>Timezone<input name="timezone" value="Europe/Moscow" required></label><label>Адрес<input name="address"></label>')+formCard("Новая услуга","serviceForm",'<label>Название<input name="name" required></label><label>Длительность, мин<input name="duration" type="number" value="60" min="1" required></label><label>Цена<input name="price" type="number" min="0" step=".01" required></label>')+formCard("Новый сотрудник","staffForm",'<label>Имя<input name="name" required></label><label>Филиал<select name="location">'+(locations||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label>')+formCard("Новый клиент","customerForm",'<label>Имя<input name="name" required></label><label>Телефон<input name="phone" required></label><label>Email<input name="email" type="email"></label>')+'</div>':"")+
 (manager?'<section class="section grid"><form id="assignForm" class="card stack"><h3>Назначить услугу</h3><label>Сотрудник<select name="staff">'+(staff||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Услуга<select name="service">'+(services||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><button>Назначить</button></form><form id="inviteForm" class="card stack"><h3>Пригласить пользователя</h3><label>Роль<select name="role"><option value="admin">Администратор</option><option value="staff">Сотрудник</option></select></label><label>Сотрудник<select name="staff"><option value="">—</option>'+(staff||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><button>Создать ссылку</button><div id="inviteMsg"></div></form></section>':"")+
 '<section class="section grid">'+listCard("Филиалы",locations,x=>x.name+" · "+x.timezone)+listCard("Услуги",services,x=>x.name+" · "+money(x.price)+" · "+x.duration_minutes+" мин")+listCard("Сотрудники",staff,x=>x.name)+listCard("Клиенты",customers,x=>x.name+" · "+x.phone)+'</section>'+
 (manager?'<section class="section"><h2>Приглашения</h2><div class="card">'+(invites||[]).map(i=>'<div class="row"><span>'+esc(i.role)+'</span><code>#/join/'+i.token+'</code><span>'+dt(i.expires_at)+'</span></div>').join("")+'</div></section>':"");
 if(manager)bindCatalogForms(p,locations||[]);
}
function formCard(title,id,body){return '<form id="'+id+'" class="card stack"><h3>'+title+'</h3>'+body+'<button>Добавить</button></form>'}
function listCard(title,rows,fmt){return '<div class="card"><h3>'+title+'</h3>'+((rows||[]).map(x=>'<div class="row"><span>'+esc(fmt(x))+'</span></div>').join(""))+'</div>'}
function bindCatalogForms(p){
 const bind=(id,table,map)=>document.querySelector("#"+id)?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.from(table).insert(map(f));if(error)alert(error.message);else catalog()});
 bind("locForm","locations",f=>({organization_id:p.organization_id,name:f.get("name"),timezone:f.get("timezone"),address:f.get("address")||null}));
 bind("serviceForm","services",f=>({organization_id:p.organization_id,name:f.get("name"),duration_minutes:Number(f.get("duration")),price:f.get("price")}));
 bind("staffForm","staff_members",f=>({organization_id:p.organization_id,name:f.get("name"),location_id:f.get("location")}));
 bind("customerForm","customers",f=>({organization_id:p.organization_id,name:f.get("name"),phone:f.get("phone"),email:f.get("email")||null}));
 document.querySelector("#assignForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.from("staff_services").insert({staff_id:f.get("staff"),service_id:f.get("service")});if(error&&!error.message.includes("duplicate"))alert(error.message);else alert("Назначено")});
 document.querySelector("#inviteForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const role=f.get("role");const staffId=f.get("staff")||null;if(role==="staff"&&!staffId){alert("Для роли staff выберите сотрудника");return}const {data,error}=await sb.from("user_invites").insert({organization_id:p.organization_id,role,staff_id:staffId}).select("token").single();if(error){alert(error.message);return}const link=location.href.split("#")[0]+"#/join/"+data.token;document.querySelector("#inviteMsg").innerHTML=msg("Ссылка: "+link)});
}

async function schedule(){
 if(!await requireAuth())return;const p=await profile();const {data:staff}=await sb.from("staff_members").select("*").order("name");const sid=staff?.[0]?.id||"";
 app.innerHTML='<h1>Расписание</h1><label style="max-width:400px">Сотрудник<select id="schedStaff">'+(staff||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><div id="schedBody" class="section"></div>';
 const load=async()=>{
  const staffId=document.querySelector("#schedStaff").value;const [{data:hours},{data:off}]=await Promise.all([sb.from("working_hours").select("*").eq("staff_id",staffId).order("weekday"),sb.from("time_off").select("*").eq("staff_id",staffId).order("start_at")]);
  const manager=["owner","admin"].includes(p.role);
  document.querySelector("#schedBody").innerHTML=(manager?'<div class="grid"><form id="hoursForm" class="card stack"><h3>Рабочие часы</h3><label>День<select name="weekday">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map((x,i)=>'<option value="'+i+'">'+x+'</option>').join("")+'</select></label><label>С<input name="start" type="time" value="09:00" required></label><label>До<input name="end" type="time" value="18:00" required></label><button>Добавить</button></form><form id="offForm" class="card stack"><h3>Time off</h3><label>Начало<input name="start" type="datetime-local" required></label><label>Конец<input name="end" type="datetime-local" required></label><label>Причина<input name="reason"></label><button>Добавить</button></form></div>':"")+'<div class="grid section"><div class="card"><h3>Рабочая неделя</h3>'+(hours||[]).map(x=>'<div class="row"><span>'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"][x.weekday]+' '+x.start_time.slice(0,5)+'–'+x.end_time.slice(0,5)+'</span>'+(manager?'<button class="secondary" data-del-hours="'+x.id+'">Удалить</button>':"")+'</div>').join("")+'</div><div class="card"><h3>Исключения</h3>'+(off||[]).map(x=>'<div class="row"><span>'+dt(x.start_at)+' → '+dt(x.end_at)+'</span>'+(manager?'<button class="secondary" data-del-off="'+x.id+'">Удалить</button>':"")+'</div>').join("")+'</div></div>';
  if(manager){
   document.querySelector("#hoursForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.from("working_hours").insert({staff_id:staffId,weekday:Number(f.get("weekday")),start_time:f.get("start"),end_time:f.get("end")});if(error)alert(error.message);else load()});
   document.querySelector("#offForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await sb.from("time_off").insert({staff_id:staffId,start_at:new Date(String(f.get("start"))).toISOString(),end_at:new Date(String(f.get("end"))).toISOString(),reason:f.get("reason")||null});if(error)alert(error.message);else load()});
   document.querySelectorAll("[data-del-hours]").forEach(b=>b.addEventListener("click",async()=>{await sb.from("working_hours").delete().eq("id",b.dataset.delHours);load()}));
   document.querySelectorAll("[data-del-off]").forEach(b=>b.addEventListener("click",async()=>{await sb.from("time_off").delete().eq("id",b.dataset.delOff);load()}));
  }
 };
 document.querySelector("#schedStaff").addEventListener("change",load); if(sid)load();
}

async function publicBook(slug){
 const {data:catalog,error}=await sb.rpc("get_public_catalog",{p_slug:slug});
 if(error||!catalog){app.innerHTML=msg(error?.message||"Организация не найдена","error");return}
 const key="lootly_booking_"+slug;let sk=sessionStorage.getItem(key);if(!sk){sk=crypto.randomUUID();sessionStorage.setItem(key,sk)}sb.rpc("track_public_booking_view",{p_slug:slug,p_session_key:sk});
 const locs=catalog.locations||[], services=catalog.services||[];
 app.innerHTML='<div class="card" style="max-width:760px;margin:auto"><h1>'+esc(catalog.organization.name)+'</h1><p class="muted">Онлайн-запись</p><form id="publicForm" class="stack"><div class="grid"><label>Филиал<select name="location">'+locs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Услуга<select name="service">'+services.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' · '+money(x.price)+'</option>').join("")+'</select></label><label>Специалист<select name="staff"><option value="">Любой доступный</option></select></label><label>Дата<input name="day" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label></div><label>Свободный слот<select name="slot"><option value="">Выберите слот</option></select></label><label>Имя<input name="name" required></label><label>Телефон<input name="phone" required></label><label>Email<input name="email" type="email"></label><button>Записаться</button><div id="pubMsg"></div></form></div>';
 const form=document.querySelector("#publicForm");
 const loadStaff=async()=>{const f=new FormData(form);const {data}=await sb.rpc("get_public_staff",{p_slug:slug,p_location_id:f.get("location"),p_service_id:f.get("service")});form.elements.staff.innerHTML='<option value="">Любой доступный</option>'+((data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join(""));loadSlots()};
 const loadSlots=async()=>{const f=new FormData(form);const {data,error}=await sb.rpc("get_public_availability",{p_slug:slug,p_location_id:f.get("location"),p_service_id:f.get("service"),p_day:f.get("day"),p_staff_id:f.get("staff")||null});form.elements.slot.innerHTML=error?'<option>'+esc(error.message)+'</option>':'<option value="">Выберите слот</option>'+((data||[]).map(x=>'<option data-staff="'+x.staff_id+'" value="'+x.start_at+'">'+dt(x.start_at)+'</option>').join(""))};
 form.elements.location.addEventListener("change",loadStaff);form.elements.service.addEventListener("change",loadStaff);form.elements.staff.addEventListener("change",loadSlots);form.elements.day.addEventListener("change",loadSlots);loadStaff();
 form.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(form),opt=form.elements.slot.selectedOptions[0],out=document.querySelector("#pubMsg");if(!f.get("slot"))return;const staffId=f.get("staff")||opt.dataset.staff;const {data,error}=await sb.rpc("create_public_booking",{p_slug:slug,p_location_id:f.get("location"),p_service_id:f.get("service"),p_staff_id:staffId,p_start_at:f.get("slot"),p_customer_name:f.get("name"),p_customer_phone:f.get("phone"),p_customer_email:f.get("email")||null,p_note:null,p_booking_key:crypto.randomUUID()});if(error){out.innerHTML=msg(error.message,"error");loadSlots();return}out.innerHTML=msg("Готово. Номер записи: "+data.id);form.querySelector("button").disabled=true});
}

async function route(){
 await refreshNav();
 const parts=(location.hash||"#/").replace(/^#\//,"").split("/").filter(Boolean);
 try{
  if(!parts.length) return home();
  if(parts[0]==="setup") return setup();
  if(parts[0]==="join"&&parts[1]) return join(parts[1]);
  if(parts[0]==="login") return login();
  if(parts[0]==="dashboard") return dashboard();
  if(parts[0]==="catalog") return catalog();
  if(parts[0]==="schedule") return schedule();
  if(parts[0]==="book"&&parts[1]) return publicBook(parts[1]);
  home();
 }catch(e){app.innerHTML=msg(e?.message||"Ошибка","error")}
}
addEventListener("hashchange",route);
route();
</script>
